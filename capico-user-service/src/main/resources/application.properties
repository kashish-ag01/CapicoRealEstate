spring.application.name=CAPICO-USER-SERVICE

server.port=8081

# ===============================
# DATABASE CONFIGURATION
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/capico_user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA CONFIGURATION
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# EUREKA CONFIGURATION
# ===============================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ===============================
# ACTUATOR CONFIGURATION
# ===============================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

info.app.name=Capico User Service
info.app.description=User and Authentication Service for Capico Real Estate Application
info.app.version=1.0.0

# ===============================
# JWT CONFIGURATION
# ===============================

jwt.secret=${JWT_SECRET:VGhpc0lzQUNhcGljb0p3dFNlY3JldEtleUZvckhTMjU2U2lnbmluZzIwMjY=}
jwt.expiration=86400000

# ===============================
# OPENAPI / SWAGGER
# ===============================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha