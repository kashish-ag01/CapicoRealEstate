spring.application.name=API-GATEWAY
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# User Service
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://CAPICO-USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**

# Property Service
spring.cloud.gateway.server.webmvc.routes[1].id=property-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://CAPICO-PROPERTY-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/properties/**
# Property Image Service Route
spring.cloud.gateway.server.webmvc.routes[2].id=property-image-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://CAPICO-PROPERTY-IMAGE-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/property-images/**
