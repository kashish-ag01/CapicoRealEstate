spring.application.name=CAPICO-PROPERTY-IMAGE-SERVICE
server.port=8083

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/capico_property_image_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=admin@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Image upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Local image storage for development
file.upload-dir=uploads/property-images

# Actuator
management.endpoints.web.exposure.include=health,info

# Eureka Client Configuration

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
jwt.secret=${JWT_SECRET:VGhpc0lzQUNhcGljb0p3dFNlY3JldEtleUZvckhTMjU2U2lnbmluZzIwMjY=}
