spring.application.name=CAPICO-PROPERTY-SERVICE
server.port=8082

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/capico_property_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=admin@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
jwt.secret=${JWT_SECRET:VGhpc0lzQUNhcGljb0p3dFNlY3JldEtleUZvckhTMjU2U2lnbmluZzIwMjY=}
jwt.expiration=86400000